<main class="wrap">
  <header class="head grid">
    <h1 class="main" data-spy="{{title}}">{{title}}</h1>
    <p class="lede">{{standfirst}}{{abstract}}</p>
    <dl class="meta main">
      <div><dt class="lb">Repo</dt><dd class="vv"><a href="{{repo_url}}">{{repo}}</a></dd></div>
      <div><dt class="lb">Last updated</dt><dd class="vv">{{updated}}</dd></div>
    </dl>
  </header>

  <div class="body grid">
    <article class="prose" data-source="{{title}} @ {{sha}}, {{page_url}}" data-md="{{md_abs}}">
{{content}}
    </article>
  </div>

  <footer class="foot grid">
    <div class="main mono">
      <span>Built from {{sha}}</span>
      <a href="/{{slug}}.md">{{slug}}.md</a>
      <a href="/">← All projects</a>
    </div>
  </footer>
</main>
