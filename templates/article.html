<main class="wrap">
  <header class="head grid">
    <h1 class="main" data-spy="{{title}}">{{title}}</h1>
    <p class="lede">{{standfirst}}{{abstract}}</p>
    <dl class="facts">
      <div><dt>Repo</dt><dd><a href="{{repo_url}}">{{repo}}</a></dd></div>
      <div><dt>Last updated</dt><dd>{{updated}}</dd></div>
      <div><dt></dt><dd class="acts">
        <a href="{{source_url}}">View source</a>
        <button id="copyLLM" type="button" data-md="/{{slug}}.md" title="Copy this page as markdown">Copy for LLM</button>
      </dd></div>
    </dl>
  </header>

  <div class="body grid">
    <article class="prose" data-source="{{title}} @ {{sha}}, {{page_url}}" data-md="{{md_abs}}">
{{content}}
    </article>
  </div>

  <footer class="foot grid">
    <div class="main mono">
      <span>Built from {{sha}}</span>
      <a href="/{{slug}}.md">{{slug}}.md</a>
      <a href="/">← All projects</a>
    </div>
  </footer>
</main>
