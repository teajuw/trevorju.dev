<main class="a-grid">
  <header class="a-hero">
    <span class="chip">Project</span>
    <h1 data-spy="{{title}}">{{title}}</h1>
    <p class="standfirst">{{standfirst}}</p>
    <div class="metagrid">
      <div><div class="lb">REPO</div><div class="vv">{{repo}}</div></div>
      <div><div class="lb">LAST UPDATED</div><div class="vv"><span class="live"></span>{{updated}}</div></div>
      <div><div class="lb">BUILT FROM</div><div class="vv">{{sha}}</div></div>
      <div><div class="lb">READING TIME</div><div class="vv">{{minutes}} min</div></div>
    </div>
    <div class="actions">
      <a class="btn solid" href="{{source_url}}">View on GitHub ↗</a>
      <button class="btn" id="copyLLM" type="button" data-md="/{{slug}}.md">Copy for LLM</button>
      <a class="btn" href="{{claude_url}}">Open in Claude ↗</a>
    </div>
  </header>

  <article class="prose" data-source="{{title}} @ {{sha}}, {{page_url}}" data-md="{{md_abs}}">
{{content}}
  </article>

  <footer class="a-foot mono">
    <span>Built from {{sha}}</span>
    <a href="/{{slug}}.md">{{slug}}.md</a>
    <a href="{{source_url}}">Source ↗</a>
    <a href="/">← All projects</a>
  </footer>
</main>
