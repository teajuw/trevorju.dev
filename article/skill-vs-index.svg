<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 290" role="img"><title>A skill the agent must pick, against an index that is always loaded</title><desc>Left: of ten runs, about six never opened the skill. Right: all ten runs had the index loaded.</desc>
<style>
text{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
.th{font-size:14px;font-weight:700;fill:#141413}
.ts{font-size:12px;fill:#5c5b56}
.g{fill:#f1efe7;stroke:#9a9891;stroke-width:1}
.a{fill:#f6e3da;stroke:#c2613f;stroke-width:1}
.ln{stroke:#9a9891;stroke-width:1;fill:none}
.ar{stroke:#5c5b56;stroke-width:1.4;fill:none}
.bad{stroke:#141413;stroke-width:1.6;stroke-dasharray:5 4;fill:none}
.un{fill:none;stroke:#9a9891;stroke-width:1.2;stroke-dasharray:4 3}
.div{stroke:#e4e1d7;stroke-width:1}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5c5b56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="130" y="26" text-anchor="middle">Skill, picked on demand</text><text class="th" x="390" y="26" text-anchor="middle">Index, always loaded</text><line class="div" x1="260" y1="14" x2="260" y2="226"/><circle class="a" cx="50" cy="86" r="14"/><circle class="a" cx="90" cy="86" r="14"/><circle class="a" cx="130" cy="86" r="14"/><circle class="a" cx="170" cy="86" r="14"/><circle class="un" cx="210" cy="86" r="14"/><circle class="un" cx="50" cy="130" r="14"/><circle class="un" cx="90" cy="130" r="14"/><circle class="un" cx="130" cy="130" r="14"/><circle class="un" cx="170" cy="130" r="14"/><circle class="un" cx="210" cy="130" r="14"/><circle class="a" cx="310" cy="86" r="14"/><circle class="a" cx="350" cy="86" r="14"/><circle class="a" cx="390" cy="86" r="14"/><circle class="a" cx="430" cy="86" r="14"/><circle class="a" cx="470" cy="86" r="14"/><circle class="a" cx="310" cy="130" r="14"/><circle class="a" cx="350" cy="130" r="14"/><circle class="a" cx="390" cy="130" r="14"/><circle class="a" cx="430" cy="130" r="14"/><circle class="a" cx="470" cy="130" r="14"/><text class="ts" x="130" y="180" text-anchor="middle">never opened in 56% of runs</text><text class="ts" x="130" y="200" text-anchor="middle">scored 53%, same as no docs at all</text><text class="ts" x="390" y="180" text-anchor="middle">nothing for the agent to choose</text><text class="ts" x="390" y="200" text-anchor="middle">scored 100%</text><circle class="a" cx="92" cy="266" r="7"/><text class="ts" x="106" y="270" text-anchor="start">run that used the docs</text><circle class="un" cx="290" cy="266" r="7"/><text class="ts" x="304" y="270" text-anchor="start">run that never opened them</text>
</svg>
