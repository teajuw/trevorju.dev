<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" role="img"><title>Every agent owning a piece, against someone owning the whole</title><desc>Left: three agents each write an article and nothing connects to the site-level goal. Right: an editor and the owner sit between the goal and the three articles.</desc>
<style>
text{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
.th{font-size:14px;font-weight:700;fill:#141413}
.ts{font-size:12px;fill:#5c5b56}
.g{fill:#f1efe7;stroke:#9a9891;stroke-width:1}
.a{fill:#f6e3da;stroke:#c2613f;stroke-width:1}
.ln{stroke:#9a9891;stroke-width:1;fill:none}
.ar{stroke:#5c5b56;stroke-width:1.4;fill:none}
.bad{stroke:#141413;stroke-width:1.6;stroke-dasharray:5 4;fill:none}
.un{fill:none;stroke:#9a9891;stroke-width:1.2;stroke-dasharray:4 3}
.div{stroke:#e4e1d7;stroke-width:1}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5c5b56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="130" y="26" text-anchor="middle">Every agent owns a piece</text><text class="th" x="390" y="26" text-anchor="middle">Someone owns the whole</text><line class="div" x1="260" y1="14" x2="260" y2="316"/><rect class="bad" x="60" y="60" width="140" height="40" rx="3"/><text class="ts" x="130" y="84" text-anchor="middle">site-level goal</text><line class="ln" x1="60" y1="232" x2="60" y2="250"/><rect class="g" x="30" y="196" width="60" height="36" rx="3"/><text class="ts" x="60.0" y="214.0" text-anchor="middle" dominant-baseline="central">article</text><circle class="g" cx="60" cy="264" r="14"/><line class="ln" x1="130" y1="232" x2="130" y2="250"/><rect class="g" x="100" y="196" width="60" height="36" rx="3"/><text class="ts" x="130.0" y="214.0" text-anchor="middle" dominant-baseline="central">article</text><circle class="g" cx="130" cy="264" r="14"/><line class="ln" x1="200" y1="232" x2="200" y2="250"/><rect class="g" x="170" y="196" width="60" height="36" rx="3"/><text class="ts" x="200.0" y="214.0" text-anchor="middle" dominant-baseline="central">article</text><circle class="g" cx="200" cy="264" r="14"/><text class="ts" x="130" y="314" text-anchor="middle">no one checks the whole</text><line class="ln" x1="390" y1="100" x2="390" y2="120"/><line class="ln" x1="360" y1="156" x2="320" y2="196"/><line class="ln" x1="390" y1="156" x2="390" y2="196"/><line class="ln" x1="420" y1="156" x2="460" y2="196"/><rect class="a" x="320" y="60" width="140" height="40" rx="3"/><text class="ts" x="390.0" y="80.0" text-anchor="middle" dominant-baseline="central">site-level goal</text><rect class="a" x="330" y="120" width="120" height="36" rx="3"/><text class="ts" x="390.0" y="138.0" text-anchor="middle" dominant-baseline="central">editor + owner</text><line class="ln" x1="320" y1="232" x2="320" y2="250"/><rect class="g" x="290" y="196" width="60" height="36" rx="3"/><text class="ts" x="320.0" y="214.0" text-anchor="middle" dominant-baseline="central">article</text><circle class="g" cx="320" cy="264" r="14"/><line class="ln" x1="390" y1="232" x2="390" y2="250"/><rect class="g" x="360" y="196" width="60" height="36" rx="3"/><text class="ts" x="390.0" y="214.0" text-anchor="middle" dominant-baseline="central">article</text><circle class="g" cx="390" cy="264" r="14"/><line class="ln" x1="460" y1="232" x2="460" y2="250"/><rect class="g" x="430" y="196" width="60" height="36" rx="3"/><text class="ts" x="460.0" y="214.0" text-anchor="middle" dominant-baseline="central">article</text><circle class="g" cx="460" cy="264" r="14"/><text class="ts" x="390" y="314" text-anchor="middle">one reader checks the whole</text>
</svg>
