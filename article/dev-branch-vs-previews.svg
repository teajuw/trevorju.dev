<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" role="img"><title>A standing dev branch, against a preview for every change</title><desc>Left: three agents push into one dev branch that goes live all at once. Right: three agents each get a preview; two pass and go live, one fails and stays out.</desc>
<style>
text{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
.th{font-size:14px;font-weight:700;fill:#141413}
.ts{font-size:12px;fill:#5c5b56}
.g{fill:#f1efe7;stroke:#9a9891;stroke-width:1}
.a{fill:#f6e3da;stroke:#c2613f;stroke-width:1}
.ln{stroke:#9a9891;stroke-width:1;fill:none}
.ar{stroke:#5c5b56;stroke-width:1.4;fill:none}
.bad{stroke:#141413;stroke-width:1.6;stroke-dasharray:5 4;fill:none}
.un{fill:none;stroke:#9a9891;stroke-width:1.2;stroke-dasharray:4 3}
.div{stroke:#e4e1d7;stroke-width:1}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5c5b56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="130" y="26" text-anchor="middle">Standing dev branch</text><text class="th" x="390" y="26" text-anchor="middle">A preview per change</text><line class="div" x1="260" y1="14" x2="260" y2="316"/><line class="ln" x1="60" y1="98" x2="100" y2="130"/><line class="ln" x1="130" y1="98" x2="130" y2="130"/><line class="ln" x1="200" y1="98" x2="160" y2="130"/><line class="ar" x1="130" y1="186" x2="130" y2="226" marker-end="url(#arrow)"/><circle class="g" cx="60" cy="84" r="14"/><circle class="g" cx="130" cy="84" r="14"/><circle class="g" cx="200" cy="84" r="14"/><rect class="g" x="60" y="130" width="140" height="56" rx="3"/><text class="th" x="130.0" y="149.0" text-anchor="middle" dominant-baseline="central">dev branch</text><text class="ts" x="130.0" y="168.0" text-anchor="middle" dominant-baseline="central">changes pile up</text><rect class="g" x="60" y="230" width="140" height="56" rx="3"/><text class="th" x="130.0" y="249.0" text-anchor="middle" dominant-baseline="central">Live site</text><text class="ts" x="130.0" y="268.0" text-anchor="middle" dominant-baseline="central">all or nothing</text><text class="ts" x="130" y="314" text-anchor="middle">one bad change holds up the rest</text><line class="ln" x1="310" y1="98" x2="310" y2="124"/><line class="ln" x1="390" y1="98" x2="390" y2="124"/><line class="ln" x1="470" y1="98" x2="470" y2="124"/><line class="ar" x1="310" y1="164" x2="353" y2="226" marker-end="url(#arrow)"/><line class="ar" x1="390" y1="164" x2="390" y2="226" marker-end="url(#arrow)"/><circle class="g" cx="310" cy="84" r="14"/><circle class="g" cx="390" cy="84" r="14"/><circle class="g" cx="470" cy="84" r="14"/><rect class="a" x="274" y="124" width="72" height="40" rx="3"/><text class="ts" x="310.0" y="144.0" text-anchor="middle" dominant-baseline="central">preview</text><rect class="a" x="354" y="124" width="72" height="40" rx="3"/><text class="ts" x="390.0" y="144.0" text-anchor="middle" dominant-baseline="central">preview</text><rect class="bad" x="434" y="124" width="72" height="40" rx="3"/><text class="ts" x="470" y="148" text-anchor="middle">preview</text><text class="ts" x="470" y="184" text-anchor="middle">fails its check</text><rect class="g" x="320" y="230" width="140" height="56" rx="3"/><text class="th" x="390.0" y="249.0" text-anchor="middle" dominant-baseline="central">Live site</text><text class="ts" x="390.0" y="268.0" text-anchor="middle" dominant-baseline="central">main is live</text><text class="ts" x="390" y="314" text-anchor="middle">a failing change stays out; the rest land</text>
</svg>
