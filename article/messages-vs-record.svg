<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 350" role="img"><title>Agents coordinating by messages, against agents sharing one record</title><desc>Left: five agents each connected to every other, ten lines, one a message nobody read. Right: the same five agents each connected only to one record with five tables.</desc>
<style>
text{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
.th{font-size:14px;font-weight:700;fill:#141413}
.ts{font-size:12px;fill:#5c5b56}
.g{fill:#f1efe7;stroke:#9a9891;stroke-width:1}
.a{fill:#f6e3da;stroke:#c2613f;stroke-width:1}
.ln{stroke:#9a9891;stroke-width:1;fill:none}
.ar{stroke:#5c5b56;stroke-width:1.4;fill:none}
.bad{stroke:#141413;stroke-width:1.6;stroke-dasharray:5 4;fill:none}
.un{fill:none;stroke:#9a9891;stroke-width:1.2;stroke-dasharray:4 3}
.div{stroke:#e4e1d7;stroke-width:1}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5c5b56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="130" y="26" text-anchor="middle">Messages</text><text class="th" x="390" y="26" text-anchor="middle">A shared record</text><line class="div" x1="260" y1="14" x2="260" y2="336"/><line class="ln" x1="130" y1="90" x2="30" y2="160"/><line class="ln" x1="130" y1="90" x2="230" y2="160"/><line class="ln" x1="130" y1="90" x2="60" y2="260"/><line class="ln" x1="130" y1="90" x2="200" y2="260"/><line class="ln" x1="30" y1="160" x2="230" y2="160"/><line class="ln" x1="30" y1="160" x2="60" y2="260"/><line class="ln" x1="230" y1="160" x2="60" y2="260"/><line class="ln" x1="230" y1="160" x2="200" y2="260"/><line class="ln" x1="60" y1="260" x2="200" y2="260"/><line class="bad" x1="30" y1="160" x2="200" y2="260"/><circle class="g" cx="130" cy="90" r="16"/><circle class="g" cx="30" cy="160" r="16"/><circle class="g" cx="230" cy="160" r="16"/><circle class="g" cx="60" cy="260" r="16"/><circle class="g" cx="200" cy="260" r="16"/><text class="ts" x="130" y="310" text-anchor="middle">10 channels for 5 agents</text><line class="bad" x1="54" y1="332" x2="84" y2="332"/><text class="ts" x="92" y="336" text-anchor="start">a message nobody read</text><line class="ln" x1="296" y1="110" x2="330" y2="110"/><line class="ln" x1="296" y1="180" x2="330" y2="180"/><line class="ln" x1="296" y1="250" x2="330" y2="250"/><line class="ln" x1="484" y1="140" x2="450" y2="140"/><line class="ln" x1="484" y1="220" x2="450" y2="220"/><rect class="a" x="330" y="80" width="120" height="200" rx="3"/><text class="ts" x="390" y="100" text-anchor="middle" dominant-baseline="central">Announce</text><text class="ts" x="390" y="140" text-anchor="middle" dominant-baseline="central">Assign</text><line x1="330" y1="120" x2="450" y2="120" stroke="#c2613f" stroke-width="0.6"/><text class="ts" x="390" y="180" text-anchor="middle" dominant-baseline="central">Notes</text><line x1="330" y1="160" x2="450" y2="160" stroke="#c2613f" stroke-width="0.6"/><text class="ts" x="390" y="220" text-anchor="middle" dominant-baseline="central">Subtasks</text><line x1="330" y1="200" x2="450" y2="200" stroke="#c2613f" stroke-width="0.6"/><text class="ts" x="390" y="260" text-anchor="middle" dominant-baseline="central">Landed</text><line x1="330" y1="240" x2="450" y2="240" stroke="#c2613f" stroke-width="0.6"/><circle class="g" cx="280" cy="110" r="16"/><circle class="g" cx="280" cy="180" r="16"/><circle class="g" cx="280" cy="250" r="16"/><circle class="g" cx="500" cy="140" r="16"/><circle class="g" cx="500" cy="220" r="16"/><text class="ts" x="390" y="310" text-anchor="middle">5 channels, one record</text><text class="ts" x="390" y="336" text-anchor="middle">tables from the 1,000-agent run</text>
</svg>
