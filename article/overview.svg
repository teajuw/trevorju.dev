<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t d" font-family="ui-monospace, 'SF Mono', Menlo, monospace">
  <title id="t">How trevorju.dev is built</title>
  <desc id="d">Project repos on GitHub are read at a pinned commit by the portfolio repo, which holds the pins, notes and templates, and builds the site with a markdown twin of every page.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#141413" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="720" height="300" fill="#faf9f5"/>

  <g fill="#f1efe7" stroke="#141413" stroke-width="1">
    <rect x="16" y="40" width="190" height="220"/>
    <rect x="265" y="40" width="190" height="220"/>
    <rect x="514" y="40" width="190" height="220"/>
  </g>

  <g fill="#141413" font-size="13" font-weight="600">
    <text x="30" y="66">Project repos</text>
    <text x="279" y="66">Portfolio repo</text>
    <text x="528" y="66">The site</text>
  </g>
  <g fill="#5c5b56" font-size="11">
    <text x="30" y="84">on GitHub, read only</text>
    <text x="279" y="84">source and deploy</text>
    <text x="528" y="84">GitHub Pages</text>
  </g>

  <g fill="#ffffff" stroke="#e4e1d7" stroke-width="1">
    <rect x="30" y="100" width="162" height="40"/>
    <rect x="30" y="148" width="162" height="40"/>
    <rect x="279" y="100" width="162" height="40"/>
    <rect x="279" y="148" width="162" height="40"/>
    <rect x="279" y="196" width="162" height="40"/>
    <rect x="528" y="100" width="162" height="40"/>
    <rect x="528" y="148" width="162" height="40"/>
    <rect x="528" y="196" width="162" height="40"/>
  </g>
  <g fill="#141413" font-size="12">
    <text x="40" y="125">article/article.md</text>
    <text x="40" y="173">the code</text>
    <text x="289" y="125">projects/ @ commit</text>
    <text x="289" y="173">notes/ + log</text>
    <text x="289" y="221">templates + build.py</text>
    <text x="538" y="125">/project/</text>
    <text x="538" y="173">/project.md</text>
    <text x="538" y="221">/llms.txt</text>
  </g>

  <g stroke="#141413" stroke-width="1.5" fill="none">
    <line x1="210" y1="150" x2="259" y2="150" marker-end="url(#a)"/>
    <line x1="459" y1="150" x2="508" y2="150" marker-end="url(#a)"/>
  </g>
  <g fill="#c2613f" font-size="12" font-weight="600" text-anchor="middle">
    <text x="235" y="138">sync</text>
    <text x="484" y="138">publish</text>
  </g>
</svg>
