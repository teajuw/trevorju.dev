<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 216" role="img"><title>The route a change takes to the live site, today and as planned</title><desc>Today: a clone per session, check, push to main, live site. Planned: pull request on its own branch, preview URL with the check, the owner merges, live site.</desc>
<style>
text{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
.th{font-size:14px;font-weight:700;fill:#141413}
.ts{font-size:12px;fill:#5c5b56}
.g{fill:#f1efe7;stroke:#9a9891;stroke-width:1}
.a{fill:#f6e3da;stroke:#c2613f;stroke-width:1}
.ln{stroke:#9a9891;stroke-width:1;fill:none}
.ar{stroke:#5c5b56;stroke-width:1.4;fill:none}
.bad{stroke:#141413;stroke-width:1.6;stroke-dasharray:5 4;fill:none}
.un{fill:none;stroke:#9a9891;stroke-width:1.2;stroke-dasharray:4 3}
.div{stroke:#e4e1d7;stroke-width:1}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5c5b56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="6" y="24" text-anchor="start">Today</text><text class="th" x="6" y="134" text-anchor="start">Planned</text><rect class="g" x="6" y="36" width="112" height="56" rx="3"/><text class="th" x="62.0" y="55.0" text-anchor="middle" dominant-baseline="central">Own clone</text><text class="ts" x="62.0" y="74.0" text-anchor="middle" dominant-baseline="central">per session</text><rect class="g" x="138" y="36" width="112" height="56" rx="3"/><text class="th" x="194.0" y="55.0" text-anchor="middle" dominant-baseline="central">Check</text><text class="ts" x="194.0" y="74.0" text-anchor="middle" dominant-baseline="central">build + shots</text><line class="ar" x1="120" y1="64" x2="134" y2="64" marker-end="url(#arrow)"/><rect class="g" x="270" y="36" width="112" height="56" rx="3"/><text class="th" x="326.0" y="55.0" text-anchor="middle" dominant-baseline="central">Push main</text><text class="ts" x="326.0" y="74.0" text-anchor="middle" dominant-baseline="central">no review</text><line class="ar" x1="252" y1="64" x2="266" y2="64" marker-end="url(#arrow)"/><rect class="g" x="402" y="36" width="112" height="56" rx="3"/><text class="th" x="458.0" y="55.0" text-anchor="middle" dominant-baseline="central">Live site</text><text class="ts" x="458.0" y="74.0" text-anchor="middle" dominant-baseline="central">trevorju.dev</text><line class="ar" x1="384" y1="64" x2="398" y2="64" marker-end="url(#arrow)"/><rect class="a" x="6" y="146" width="112" height="56" rx="3"/><text class="th" x="62.0" y="165.0" text-anchor="middle" dominant-baseline="central">Pull request</text><text class="ts" x="62.0" y="184.0" text-anchor="middle" dominant-baseline="central">own branch</text><rect class="a" x="138" y="146" width="112" height="56" rx="3"/><text class="th" x="194.0" y="165.0" text-anchor="middle" dominant-baseline="central">Preview URL</text><text class="ts" x="194.0" y="184.0" text-anchor="middle" dominant-baseline="central">build + shots</text><line class="ar" x1="120" y1="174" x2="134" y2="174" marker-end="url(#arrow)"/><rect class="a" x="270" y="146" width="112" height="56" rx="3"/><text class="th" x="326.0" y="165.0" text-anchor="middle" dominant-baseline="central">Merge</text><text class="ts" x="326.0" y="184.0" text-anchor="middle" dominant-baseline="central">owner approves</text><line class="ar" x1="252" y1="174" x2="266" y2="174" marker-end="url(#arrow)"/><rect class="g" x="402" y="146" width="112" height="56" rx="3"/><text class="th" x="458.0" y="165.0" text-anchor="middle" dominant-baseline="central">Live site</text><text class="ts" x="458.0" y="184.0" text-anchor="middle" dominant-baseline="central">trevorju.dev</text><line class="ar" x1="384" y1="174" x2="398" y2="174" marker-end="url(#arrow)"/>
</svg>
