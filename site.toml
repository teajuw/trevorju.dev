# The few facts about the site that are not in a project repo.
name = "Trevor Ju"
# tagline is the page description and the summary in llms.txt. The home page shows
# the name, then abstract as its one sentence.
tagline = "Claude's human in the loop."
abstract = "I write evals, build agents, and pit them against each other."
# The links menu at the top right of the home page. resume is a path or address
# to a PDF; leave it out and the menu has no résumé row.
# resume = "/resume.pdf"
url = "https://trevorju.dev"
github = "https://github.com/teajuw"
linkedin = "https://www.linkedin.com/in/trevorju"
repo = "https://github.com/teajuw/trevorju.dev"

# This repo is a project too, once article/article.md exists at its root.
# Its page is served at /<self_slug>/.
self_slug = "portfolio"

# Placeholder rows on the home page for projects not written up yet. Set to 0 to remove.
blanks = 2
blank_title = "Next project"
blank_text = "Write-up in progress."

# The tabs above the project list, in order, after "All". A project appears under
# the tab named for it in [topics]; one with no topic shows only under "All".
tabs = ["Agents", "ML", "Tools"]

[topics]
portfolio = "Agents"
bar2vec = "ML"
3rd-shot = "ML"
md-reader = "Tools"
