<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 250" role="img"><title>How a listing is judged, and how a judge's unanswered check improves the wiki</title><desc>A listing becomes a rubric. A judge answers the rubric from the wiki and produces verdicts, which go to the tracker. Checks the judge could not answer become gaps, an interview closes them, and the answers go back into the wiki.</desc>
<style>
text{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
.th{font-size:14px;font-weight:700;fill:#141413}
.ts{font-size:12px;fill:#5c5b56}
.g{fill:#f1efe7;stroke:#9a9891;stroke-width:1}
.a{fill:#f6e3da;stroke:#c2613f;stroke-width:1}
.ar{stroke:#5c5b56;stroke-width:1.4;fill:none}
.lp{stroke:#c2613f;stroke-width:1.6;fill:none}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5c5b56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrowa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#c2613f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect class="g" x="6" y="30" width="108" height="56" rx="3"/><text class="th" x="60" y="52" text-anchor="middle">Listing</text><text class="ts" x="60" y="71" text-anchor="middle">clipped page</text>
<rect class="g" x="130" y="30" width="108" height="56" rx="3"/><text class="th" x="184" y="52" text-anchor="middle">Rubric</text><text class="ts" x="184" y="71" text-anchor="middle">frozen checks</text>
<rect class="g" x="254" y="30" width="108" height="56" rx="3"/><text class="th" x="308" y="52" text-anchor="middle">Judge</text><text class="ts" x="308" y="71" text-anchor="middle">evidence first</text>
<rect class="g" x="378" y="30" width="108" height="56" rx="3"/><text class="th" x="432" y="52" text-anchor="middle">Verdicts</text><text class="ts" x="432" y="71" text-anchor="middle">yes, no, unclear</text>
<rect class="g" x="502" y="30" width="108" height="56" rx="3"/><text class="th" x="556" y="52" text-anchor="middle">Tracker</text><text class="ts" x="556" y="71" text-anchor="middle">one score</text>
<line class="ar" x1="116" y1="58" x2="127" y2="58" marker-end="url(#arrow)"/>
<line class="ar" x1="240" y1="58" x2="251" y2="58" marker-end="url(#arrow)"/>
<line class="ar" x1="364" y1="58" x2="375" y2="58" marker-end="url(#arrow)"/>
<line class="ar" x1="488" y1="58" x2="499" y2="58" marker-end="url(#arrow)"/>
<rect class="a" x="254" y="164" width="108" height="56" rx="3"/><text class="th" x="308" y="186" text-anchor="middle">Wiki</text><text class="ts" x="308" y="205" text-anchor="middle">what I have done</text>
<rect class="a" x="378" y="164" width="108" height="56" rx="3"/><text class="th" x="432" y="186" text-anchor="middle">Gaps</text><text class="ts" x="432" y="205" text-anchor="middle">open questions</text>
<line class="lp" x1="308" y1="162" x2="308" y2="90" marker-end="url(#arrowa)"/><text class="ts" x="300" y="130" text-anchor="end">read in full</text>
<line class="lp" x1="432" y1="88" x2="432" y2="160" marker-end="url(#arrowa)"/><text class="ts" x="440" y="130" text-anchor="start">each unclear</text>
<line class="lp" x1="376" y1="192" x2="366" y2="192" marker-end="url(#arrowa)"/>
<text class="ts" x="370" y="240" text-anchor="middle">an interview answers them</text>
</svg>
